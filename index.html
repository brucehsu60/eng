<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中英文歷屆題庫系統 (動態版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">📖 英文歷屆題庫系統 - 83年學測</h1>
            <div class="flex gap-2" id="question-navigator">
                <!-- 導覽按鈕會由 JS 動態生成 -->
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex flex-col lg:flex-row gap-6 h-[75vh]" id="main-container">
            
            <!-- 左欄：文章區 (無文章時會隱藏) -->
            <div id="passage-section" class="w-full lg:w-1/2 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col h-full hidden">
                <div class="bg-blue-50 px-4 py-2 border-b border-blue-100 font-bold text-blue-800 flex justify-between items-center">
                    <span id="part-name">大題名稱</span>
                    <button onclick="toggleTranslation()" class="text-xs bg-white border border-blue-200 px-2 py-1 rounded hover:bg-blue-100">中英對照</button>
                </div>
                <div class="p-6 overflow-y-auto custom-scrollbar flex-1 text-lg leading-relaxed">
                    <div id="passage-content" class="text-gray-800"></div>
                    <div id="passage-translation" class="hidden mt-6 p-4 bg-gray-50 border-l-4 border-blue-400 text-base text-gray-700"></div>
                </div>
            </div>

            <!-- 右欄：題目與作答區 -->
            <div id="question-section" class="w-full lg:w-1/2 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col h-full mx-auto">
                <div class="bg-gray-100 px-4 py-2 border-b border-gray-200 font-bold text-gray-700 flex justify-between">
                    <span id="q-title">Question</span>
                </div>
                
                <div class="p-6 overflow-y-auto custom-scrollbar flex-1">
                    <h3 id="q-text" class="text-lg font-medium text-gray-800 mb-6 leading-relaxed">題目載入中...</h3>
                    
                    <div class="space-y-3 mb-6" id="options-container">
                        <!-- 選項會由 JS 動態生成 -->
                    </div>

                    <button id="submit-btn" onclick="checkAnswer()" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition disabled:opacity-50" disabled>
                        送出答案
                    </button>

                    <!-- 詳解區 -->
                    <div id="explanation-box" class="hidden mt-8 fade-in bg-gray-50 border border-gray-200 rounded-lg p-5">
                        <h4 class="font-bold text-lg mb-4" id="result-status"></h4>
                        <div class="mb-4">
                            <p class="font-bold text-gray-700 mb-1">【整句翻譯】</p>
                            <p id="exp-translation" class="text-gray-600"></p>
                        </div>
                        <div class="mb-4">
                            <p class="font-bold text-gray-700 mb-1">【選項解析】</p>
                            <p id="exp-analysis" class="text-gray-600 whitespace-pre-line"></p>
                        </div>
                        <div>
                            <p class="font-bold text-gray-700 mb-1">【必背單字】</p>
                            <ul id="exp-vocab" class="grid grid-cols-1 md:grid-cols-2 gap-2 text-gray-600 text-sm"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 這是我們設計的 JSON 資料庫 (模擬從後端或檔案讀取)
        const examDatabase = {
            "parts": [
                {
                    "part_type": "vocabulary",
                    "part_name": "I. 詞彙 (單題)",
                    "has_passage": false,
                    "questions": [
                        {
                            "q_num": 1,
                            "question": "Because Mr. Chang has been busy these days, it's _______ whether he will come to the party.",
                            "options": { "A": "unlikely", "B": "impossible", "C": "doubtful", "D": "inevitable" },
                            "correct_answer": "C",
                            "explanation": {
                                "translation": "因為張先生最近很忙，所以他是否會來參加派對還很令人懷疑。",
                                "analysis": "空格後接 whether (是否)，表示一件不確定的事情。it is doubtful whether... 為常見句型，表示「對...感到懷疑」。\n(A) unlikely (不太可能) 常接 to V\n(B) impossible (不可能) 語氣太絕對\n(D) inevitable (無可避免的) 語意不符",
                                "vocab": [
                                    {"word": "doubtful", "pos": "adj.", "meaning": "令人懷疑的"},
                                    {"word": "inevitable", "pos": "adj.", "meaning": "無可避免的"}
                                ]
                            }
                        }
                    ]
                },
                {
                    "part_type": "reading",
                    "part_name": "III. 閱讀測驗 (題組)",
                    "has_passage": true,
                    "passage": "<p class='mb-4'>Most heroes are people like you. But what makes them heroes? They find special courage when they need it. They are brave enough to help in an emergency while others may stand by. A hero sees what needs to be done and does it.</p><p class='mb-4'>Sometimes heroes are rewarded for their brave acts. One such reward is the Carnegie Medal. It is given to people who act bravely and face danger to save the lives of others...</p>",
                    "passage_translation": "大多數的英雄都是像你一樣的普通人。但什麼讓他們成為英雄呢？他們在需要時會找到特別的勇氣。在緊急情況下，當其他人可能袖手旁觀時，他們夠勇敢去幫忙... (下略)",
                    "questions": [
                        {
                            "q_num": 31,
                            "question": "The Carnegie Medal is given to those who are _______",
                            "options": { "A": "sick and poor.", "B": "rich and famous.", "C": "young and brave.", "D": "unselfish and courageous." },
                            "correct_answer": "D",
                            "explanation": {
                                "translation": "卡內基獎章頒發給那些無私且有勇氣的人。",
                                "analysis": "文章第二段提到：'It is given to people who act bravely and face danger to save the lives of others.' 拯救他人即是 unselfish (無私的)，勇敢面對危險即是 courageous。",
                                "vocab": [
                                    {"word": "unselfish", "pos": "adj.", "meaning": "無私的"},
                                    {"word": "courageous", "pos": "adj.", "meaning": "有勇氣的"},
                                    {"word": "stand by", "pos": "phr.", "meaning": "袖手旁觀"}
                                ]
                            }
                        }
                    ]
                }
            ]
        };

        // 系統狀態變數
        let currentPartIndex = 0;
        let currentQuestionData = null;
        let userSelected = null;

        // 初始化頁面
        window.onload = () => {
            renderNavigator();
            loadQuestion(0); // 預設載入單字題
        };

        // 渲染上方導航按鈕 (切換單字題或閱讀題)
        function renderNavigator() {
            const nav = document.getElementById('question-navigator');
            nav.innerHTML = `
                <button onclick="loadQuestion(0)" class="bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded text-sm font-bold">第 1 題 (單字)</button>
                <button onclick="loadQuestion(1)" class="bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded text-sm font-bold">第 31 題 (閱讀)</button>
            `;
        }

        // 載入題目資料並更新 UI
        function loadQuestion(partIndex) {
            currentPartIndex = partIndex;
            const partData = examDatabase.parts[partIndex];
            currentQuestionData = partData.questions[0]; // 示範只抓該大題第一題
            userSelected = null;

            // 1. 處理左欄 (文章區)
            const passageSection = document.getElementById('passage-section');
            const questionSection = document.getElementById('question-section');
            
            if (partData.has_passage) {
                // 有文章：顯示左欄，右欄縮小為一半
                passageSection.classList.remove('hidden');
                questionSection.className = 'w-full lg:w-1/2 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col h-full';
                document.getElementById('part-name').innerText = partData.part_name;
                document.getElementById('passage-content').innerHTML = partData.passage;
                document.getElementById('passage-translation').innerHTML = partData.passage_translation;
                document.getElementById('passage-translation').classList.add('hidden');
            } else {
                // 無文章 (單字題)：隱藏左欄，右欄置中放大
                passageSection.classList.add('hidden');
                questionSection.className = 'w-full lg:w-3/5 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col h-full mx-auto';
            }

            // 2. 處理右欄 (題目區)
            document.getElementById('q-title').innerText = `第 ${currentQuestionData.q_num} 題`;
            document.getElementById('q-text').innerText = `${currentQuestionData.q_num}. ${currentQuestionData.question}`;
            
            // 產生選項
            const optionsHtml = Object.entries(currentQuestionData.options).map(([key, value]) => `
                <label class="block p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-blue-50 transition" id="label-${key}">
                    <input type="radio" name="q_option" value="${key}" class="mr-2" onclick="selectOption('${key}')"> 
                    (${key}) ${value}
                </label>
            `).join('');
            document.getElementById('options-container').innerHTML = optionsHtml;

            // 重置按鈕與詳解區
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.style.display = 'block';
            document.getElementById('explanation-box').classList.add('hidden');
        }

        // 選擇選項
        function selectOption(val) {
            userSelected = val;
            document.getElementById('submit-btn').disabled = false;
            
            // 移除所有高光
            Object.keys(currentQuestionData.options).forEach(key => {
                document.getElementById(`label-${key}`).classList.remove('bg-blue-50', 'border-blue-500');
            });
            // 加上選取高光
            document.getElementById(`label-${val}`).classList.add('bg-blue-50', 'border-blue-500');
        }

        // 送出答案並渲染詳解
        function checkAnswer() {
            if (!userSelected) return;

            // 鎖定選項
            document.querySelectorAll('input[type="radio"]').forEach(input => input.disabled = true);
            document.getElementById('submit-btn').style.display = 'none';

            const correctAns = currentQuestionData.correct_answer;
            const statusTitle = document.getElementById('result-status');
            
            // 判斷對錯標示顏色
            if (userSelected === correctAns) {
                statusTitle.innerHTML = `✅ 答對了！正確答案：(${correctAns})`;
                statusTitle.className = 'font-bold text-green-600 text-lg mb-4';
                document.getElementById(`label-${userSelected}`).classList.add('bg-green-100', 'border-green-500');
            } else {
                statusTitle.innerHTML = `❌ 答錯了！正確答案為：(${correctAns})`;
                statusTitle.className = 'font-bold text-red-600 text-lg mb-4';
                document.getElementById(`label-${userSelected}`).classList.add('bg-red-50', 'border-red-400');
                document.getElementById(`label-${correctAns}`).classList.add('bg-green-100', 'border-green-500');
            }

            // 填入 JSON 中的詳解資料
            const exp = currentQuestionData.explanation;
            document.getElementById('exp-translation').innerHTML = exp.translation;
            document.getElementById('exp-analysis').innerHTML = exp.analysis;
            
            // 填入單字表
            const vocabHtml = exp.vocab.map(v => `<li><span class="text-blue-600 font-semibold">${v.word}</span> (${v.pos}) ${v.meaning}</li>`).join('');
            document.getElementById('exp-vocab').innerHTML = vocabHtml;

            // 顯示詳解區
            document.getElementById('explanation-box').classList.remove('hidden');
        }

        // 切換文章翻譯
        function toggleTranslation() {
            const trans = document.getElementById('passage-translation');
            trans.classList.toggle('hidden');
            trans.classList.add('fade-in');
        }
    </script>
</body>
</html>
