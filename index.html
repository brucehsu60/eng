<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中英文歷屆題庫系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .lvl4-word { 
            cursor: help; border-bottom: 2px dashed #3b82f6; 
            color: #1d4ed8; font-weight: bold; transition: background-color 0.2s; padding: 0 2px;
        }
        .lvl4-word:hover { background-color: #dbeafe; border-radius: 4px; }

        #dict-tooltip {
            position: absolute; z-index: 9999; background: #1e293b; color: white;
            padding: 10px 14px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 250px; display: none; font-size: 0.9rem; line-height: 1.4; pointer-events: none;
        }
        
        .cloze-select {
            appearance: none; background: rgba(255,255,255,0.7); border: 2px solid #38bdf8;
            border-radius: 6px; padding: 2px 22px 2px 6px; font-weight: bold; color: #0369a1; cursor: pointer; outline: none; margin: 0 4px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%230369a1%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 6px top 55%; background-size: 8px auto;
        }
        .cloze-select.correct { background-color: #dcfce7; border-color: #22c55e; color: #15803d; }
        .cloze-select.wrong { background-color: #fee2e2; border-color: #ef4444; color: #b91c1c; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <div id="dict-tooltip"></div>

    <!-- 頂部 Dashboard -->
    <header class="pt-8 pb-4">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8 tracking-wider">高中英文歷屆題庫系統</h1>
        <div class="max-w-6xl mx-auto px-4">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <div class="flex items-start mb-5">
                    <div class="w-24 shrink-0 text-gray-600 font-bold mt-1">考試類別：</div>
                    <div class="flex flex-wrap gap-2" id="filter-exam"></div>
                </div>
                <div class="flex items-start mb-5">
                    <div class="w-24 shrink-0 text-gray-600 font-bold mt-1">考試年份：</div>
                    <div class="flex flex-wrap gap-2 max-h-28 overflow-y-auto custom-scrollbar pr-2" id="filter-year"></div>
                </div>
                <div class="flex items-start mb-6">
                    <div class="w-24 shrink-0 text-gray-600 font-bold mt-1">題型：</div>
                    <div class="flex flex-wrap gap-2" id="filter-type"></div>
                </div>
                
                <!-- 題號 (大題分類顯示) -->
                <div class="flex items-start pt-5 border-t border-dashed border-gray-300">
                    <div class="w-24 shrink-0 text-gray-600 font-bold mt-1">題號：</div>
                    <!-- 改用 flex-col 讓每個大題佔一列 -->
                    <div class="flex flex-col gap-3 flex-1" id="nav-container"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要作答區 -->
    <main class="max-w-6xl mx-auto px-4 py-4 w-full flex flex-col lg:flex-row gap-4 h-[650px] mb-10">
        
        <!-- 左欄：文章區 (60%) -->
        <div id="passage-section" class="w-full bg-white rounded-xl shadow-sm border flex flex-col h-full hidden transition-colors duration-300">
            <div class="px-4 py-2 border-b flex justify-between items-center bg-white/50">
                <span id="part-name" class="font-bold text-gray-700 text-sm">文章閱讀</span>
                <div class="flex gap-2">
                    <button id="btn-read-passage" onclick="readPassageAloud()" class="text-xs bg-white text-blue-600 border border-blue-300 px-2 py-1 rounded shadow-sm hover:bg-blue-50 transition font-bold">🗣️ 朗讀文章</button>
                    <button onclick="toggleTranslation()" class="text-xs bg-gray-700 text-white border border-gray-700 px-2 py-1 rounded shadow-sm hover:bg-gray-800 transition">顯示翻譯</button>
                </div>
            </div>
            <div class="p-6 overflow-y-auto custom-scrollbar flex-1 text-[1.05rem] leading-loose text-gray-800" id="passage-content"></div>
            <div id="passage-translation" class="hidden p-5 bg-yellow-100/50 border-t border-yellow-200 text-sm text-gray-800 h-2/5 overflow-y-auto custom-scrollbar leading-relaxed"></div>
        </div>

        <!-- 右欄：題目與詳解區 (40%) -->
        <div id="question-section" class="w-full bg-white rounded-xl shadow-sm border flex flex-col h-full mx-auto transition-colors duration-300">
            <div class="px-4 py-2 border-b flex justify-between bg-white/50 font-bold text-gray-700 text-sm">
                <span>題目與作答區</span>
            </div>
            <div class="p-5 overflow-y-auto custom-scrollbar flex-1 relative space-y-6" id="questions-container">
                <div class="text-center text-gray-400 mt-10">請由上方選擇題號開始作答</div>
            </div>
        </div>
    </main>

    <script>
        const config = {
            exams: ['學測', '指考', '分科'],
            qTypes: ['全部', '詞彙', '綜合測驗', '文意選填', '篇章結構', '閱讀測驗'],
            years: {
                '學測': { min: 83, max: 115 },
                '指考': { min: 91, max: 110 },
                '分科': { min: 111, max: 113 }
            }
        };

        let state = { exam: '學測', year: 83, type: '全部' };
        let examData = null;
        let activeGroup = null;
        let isSpeaking = false;
        let speechUtterance = new SpeechSynthesisUtterance();

        speechUtterance.onend = () => {
            isSpeaking = false;
            document.querySelectorAll('.btn-speak').forEach(b => {
                if(b.id === 'btn-read-passage') b.innerText = '🗣️ 朗讀文章';
                else b.innerText = '🗣️ 朗讀';
            });
        };

        window.onload = () => {
            renderDashboard();
            fetchData();
        };

        // ================= Dashboard 渲染與顏色管理 =================
        function getTypeClass(t, isActive) {
            if(!isActive) return 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50';
            if(t==='詞彙') return 'bg-green-600 text-white border-green-600';
            if(t==='綜合測驗') return 'bg-blue-600 text-white border-blue-600';
            if(t==='閱讀測驗') return 'bg-orange-600 text-white border-orange-600';
            return 'bg-blue-600 text-white border-blue-600'; // 預設藍色 (全部、篇章等)
        }

        function renderDashboard() {
            const examHTML = config.exams.map(ex => `
                <button onclick="setExam('${ex}')" class="px-4 py-1 text-sm font-bold rounded-full border transition ${state.exam === ex ? 'bg-blue-500 text-white border-blue-500' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}">${ex}</button>
            `).join('');
            document.getElementById('filter-exam').innerHTML = examHTML;

            let yearHTML = '';
            const range = config.years[state.exam];
            for (let y = range.max; y >= range.min; y--) {
                yearHTML += `<button onclick="setYear(${y})" class="px-4 py-1 text-sm font-bold rounded-full border transition ${state.year === y ? 'bg-blue-500 text-white border-blue-500' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}">${y}</button>`;
            }
            document.getElementById('filter-year').innerHTML = yearHTML;

            const typeHTML = config.qTypes.map(t => `
                <button onclick="setType('${t}')" class="px-4 py-1 text-sm font-bold rounded-full border transition ${getTypeClass(t, state.type === t)}">${t}</button>
            `).join('');
            document.getElementById('filter-type').innerHTML = typeHTML;
        }

        function setExam(exam) { state.exam = exam; state.year = config.years[exam].max; renderDashboard(); fetchData(); }
        function setYear(year) { state.year = year; renderDashboard(); fetchData(); }
        function setType(type) { state.type = type; renderDashboard(); renderQuestionNav(); } // 切換題型不捲動

        async function fetchData() {
            const paddedYear = state.year.toString().padStart(3, '0');
            const targetFile = `${state.exam}_${paddedYear}.json`;
            const container = document.getElementById('questions-container');
            try {
                let res = await fetch(`data/${targetFile}`);
                if (!res.ok && state.exam === '學測' && state.year === 83) res = await fetch(`data/083.json`);
                if (!res.ok) throw new Error();
                examData = await res.json();
                renderQuestionNav(true); // fetchData 後載入第一題
            } catch(e) {
                examData = null;
                document.getElementById('nav-container').innerHTML = `<span class="text-red-500 text-sm mt-1">找不到檔案：data/${targetFile}</span>`;
                container.innerHTML = '';
                document.getElementById('passage-section').classList.add('hidden');
            }
        }

        function getThemeColors(type) {
            if (type === 'vocabulary') return { bg: 'bg-green-100', text: 'text-green-700', border: 'border-green-300', actBg: 'bg-green-600', actText: 'text-white' };
            if (type === 'cloze') return { bg: 'bg-blue-100', text: 'text-blue-700', border: 'border-blue-300', actBg: 'bg-blue-600', actText: 'text-white' };
            if (type === 'reading') return { bg: 'bg-orange-100', text: 'text-orange-700', border: 'border-orange-300', actBg: 'bg-orange-600', actText: 'text-white' };
            return { bg: 'bg-gray-100', text: 'text-gray-700', border: 'border-gray-300', actBg: 'bg-gray-600', actText: 'text-white' };
        }

        // ================= 重點 5: 大題條列顯示 =================
        function renderQuestionNav(isInitialLoad = false) {
            const nav = document.getElementById('nav-container');
            nav.innerHTML = '';
            if(!examData) return;
            
            let firstGroupToLoad = null;

            examData.groups.forEach(group => {
                if (state.type === '全部' || group.tags.includes(state.type)) {
                    if (!firstGroupToLoad) firstGroupToLoad = group;
                    
                    // 創建大題的 Flex Row
                    const row = document.createElement('div');
                    row.className = 'flex items-center flex-wrap gap-2 mb-1';
                    
                    // 加上大題標籤 [詞彙], [閱讀測驗]
                    const tagLabel = document.createElement('span');
                    tagLabel.className = 'text-sm font-bold text-gray-400 mr-1 w-20 text-right';
                    tagLabel.innerText = `[${group.tags[0]}]`;
                    row.appendChild(tagLabel);

                    const theme = getThemeColors(group.type);
                    group.questions.forEach(q => {
                        const btn = document.createElement('button');
                        btn.className = `nav-btn w-8 h-8 text-sm rounded-full border ${theme.border} font-bold transition shadow-sm ${theme.bg} ${theme.text}`;
                        btn.innerText = q.q_num;
                        btn.dataset.groupId = group.group_id; 
                        btn.dataset.type = group.type;
                        btn.onclick = () => loadGroup(group, q.q_num, true); // 只有手動點擊才滾動
                        row.appendChild(btn);
                    });
                    nav.appendChild(row);
                }
            });
            
            if(isInitialLoad && firstGroupToLoad) {
                loadGroup(firstGroupToLoad, firstGroupToLoad.questions[0].q_num, false); // 自動載入不滾動
            } else if (!firstGroupToLoad) {
                document.getElementById('questions-container').innerHTML = '<div class="text-center text-gray-400 mt-10">此分類無題目</div>';
                document.getElementById('passage-section').classList.add('hidden');
            }
        }

        // ================= 載入題組 =================
        function loadGroup(group, clickedQNum, shouldScroll = false) {
            activeGroup = group;
            window.speechSynthesis.cancel(); 
            isSpeaking = false;

            // 題號亮燈
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const type = btn.dataset.type;
                const theme = getThemeColors(type);
                btn.className = `nav-btn w-8 h-8 text-sm rounded-full border ${theme.border} font-bold transition shadow-sm ${theme.bg} ${theme.text}`;
                
                let isActive = false;
                if (group.type === 'vocabulary') {
                    if (btn.innerText === clickedQNum.toString()) isActive = true;
                } else {
                    if (btn.dataset.groupId === group.group_id) isActive = true;
                }
                if (isActive) {
                    btn.classList.remove(theme.bg, theme.text);
                    btn.classList.add(theme.actBg, theme.actText);
                }
            });

            const passageSec = document.getElementById('passage-section');
            const questionSec = document.getElementById('question-section');
            const container = document.getElementById('questions-container');
            container.innerHTML = ''; 

            passageSec.className = passageSec.className.replace(/bg-\w+-50\/40/g, 'bg-white');
            questionSec.className = questionSec.className.replace(/bg-\w+-50\/40/g, 'bg-white');
            passageSec.classList.remove('border-green-200', 'border-blue-200', 'border-orange-200');
            questionSec.classList.remove('border-green-200', 'border-blue-200', 'border-orange-200');

            if (group.type === 'vocabulary') {
                questionSec.classList.add('bg-green-50/40', 'border-green-200');
            } else if (group.type === 'cloze') {
                passageSec.classList.add('bg-blue-50/40', 'border-blue-200');
                questionSec.classList.add('bg-blue-50/40', 'border-blue-200');
            } else {
                passageSec.classList.add('bg-orange-50/40', 'border-orange-200');
                questionSec.classList.add('bg-orange-50/40', 'border-orange-200');
            }

            // ================= 重點 4: 比例改為 60 : 40 =================
            if (group.type === 'cloze' || group.passage) {
                passageSec.classList.remove('hidden');
                passageSec.className = passageSec.className.replace(/lg:w-[^\s]+/g, 'lg:w-[60%]');
                questionSec.className = questionSec.className.replace(/lg:w-[^\s]+/g, 'lg:w-[40%]');
                document.getElementById('part-name').innerText = group.type === 'cloze' ? "綜合測驗 (克漏字)" : "閱讀測驗";
                
                let html = group.passage;
                if(group.type === 'cloze'){
                    group.questions.forEach(q => {
                        let optionsHtml = `<option value="" disabled selected>題 ${q.q_num}</option>`;
                        for (let key in q.options) optionsHtml += `<option value="${key}">${key}) ${q.options[key].replace(/<[^>]+>/g, '')}</option>`;
                        let selectHtml = `<select class="cloze-select shadow-sm" id="cloze-${q.q_num}" onchange="checkAnswer(${q.q_num}, this.value)">${optionsHtml}</select>`;
                        html = html.replace(`[BLANK_${q.q_num}]`, selectHtml);
                    });
                }
                document.getElementById('passage-content').innerHTML = html;
            } else {
                passageSec.classList.add('hidden');
                questionSec.className = questionSec.className.replace(/lg:w-[^\s]+/g, 'lg:w-[60%]');
            }

            document.getElementById('passage-translation').innerHTML = group.passage_translation || '';
            document.getElementById('passage-translation').classList.add('hidden');
            document.getElementById('btn-read-passage').innerText = '🗣️ 朗讀文章';

            group.questions.forEach(q => {
                let block = document.createElement('div');
                block.id = `q-block-${q.q_num}`;
                
                let html = `<div class="flex items-center justify-between mb-2 border-b border-gray-300/50 pb-1">
                                <h3 class="text-base font-bold text-blue-800">第 ${q.q_num} 題</h3>`;
                
                if (group.type !== 'cloze') {
                    let cleanOption = q.options[q.answer].replace(/<[^>]+>/g, '');
                    let textToRead = q.q_text.replace(/<[^>]+>/g, '').replace('_______', cleanOption).replace(/'/g, "\\'");
                    html += `<button id="btn-spk-${q.q_num}" class="btn-speak text-xs bg-white text-blue-600 border border-blue-300 px-2 py-0.5 rounded shadow-sm hover:bg-blue-50 font-bold transition" onclick="toggleSpeakQuestion(this, '${textToRead}')">🗣️ 朗讀</button>`;
                }
                html += `</div>`;
                
                if (group.type !== 'cloze') {
                    html += `<div class="text-[0.95rem] font-medium text-gray-800 mb-3">${q.q_text}</div><div class="space-y-1.5 mb-2">`;
                    for (let key in q.options) {
                        html += `
                        <label class="flex items-center p-2 border border-gray-200 bg-white/70 rounded cursor-pointer hover:bg-blue-50 transition text-sm" id="label-${q.q_num}-${key}">
                            <input type="radio" name="opt-${q.q_num}" value="${key}" class="mr-2 w-4 h-4 text-blue-600" onclick="checkAnswer(${q.q_num}, '${key}')"> 
                            <span class="font-bold mr-1 w-6">(${key})</span> <span class="flex-1">${q.options[key]}</span>
                        </label>`;
                    }
                    html += `</div>`;
                } else {
                    html += `<div class="text-gray-500 text-sm mb-2 bg-white/70 p-2 rounded border border-gray-200">👉 請在左側文章中的下拉選單作答。</div>`;
                }

                html += `
                <div id="exp-box-${q.q_num}" class="hidden bg-white/90 border border-gray-300 rounded p-4 fade-in shadow-sm mt-2">
                    <h4 class="font-bold text-base mb-2" id="status-${q.q_num}"></h4>
                    <div class="mb-2 text-[0.9rem]">
                        <span class="text-xs bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold mr-1">翻譯</span>
                        <span class="text-gray-800">${q.explanation.translation}</span>
                    </div>
                    <div class="text-[0.9rem] leading-relaxed">
                        <span class="text-xs bg-red-100 text-red-800 px-1.5 py-0.5 rounded font-bold mr-1 block mb-1 w-max">解析</span>
                        <span class="text-gray-700">${q.explanation.analysis}</span>
                    </div>
                </div>`;
                
                block.innerHTML = html;
                container.appendChild(block);
            });

            // ================= 重點 2: 點選上方條件不捲動 =================
            if (shouldScroll) {
                setTimeout(() => {
                    const targetBlock = document.getElementById(`q-block-${clickedQNum}`);
                    if (targetBlock) targetBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }
            
            bindVocabEvents();
        }

        function checkAnswer(qNum, selectedValue) {
            const question = activeGroup.questions.find(q => q.q_num === qNum);
            const statusTitle = document.getElementById(`status-${qNum}`);
            const expBox = document.getElementById(`exp-box-${qNum}`);
            const isCorrect = selectedValue === question.answer;

            if (activeGroup.type === 'cloze') {
                let sel = document.getElementById(`cloze-${qNum}`);
                sel.disabled = true; 
                if(isCorrect) {
                    sel.classList.add('correct');
                    statusTitle.innerHTML = `✅ 答對了！`;
                    statusTitle.className = 'font-bold text-green-600 text-base mb-2';
                } else {
                    sel.classList.add('wrong');
                    sel.options[sel.selectedIndex].text = `❌ 改為 ${question.answer}) ${question.options[question.answer].replace(/<[^>]+>/g, '')}`;
                    statusTitle.innerHTML = `❌ 答錯！答案為：(${question.answer})`;
                    statusTitle.className = 'font-bold text-red-600 text-base mb-2';
                }
            } else {
                document.querySelectorAll(`input[name="opt-${qNum}"]`).forEach(i => i.disabled = true);
                if (isCorrect) {
                    statusTitle.innerHTML = `✅ 答對了！答案：(${question.answer})`;
                    statusTitle.className = 'font-bold text-green-600 text-base mb-2';
                    document.getElementById(`label-${qNum}-${selectedValue}`).classList.add('bg-green-100', 'border-green-500');
                } else {
                    statusTitle.innerHTML = `❌ 答錯了！答案為：(${question.answer})`;
                    statusTitle.className = 'font-bold text-red-600 text-base mb-2';
                    document.getElementById(`label-${qNum}-${selectedValue}`).classList.add('bg-red-50', 'border-red-400');
                    document.getElementById(`label-${qNum}-${question.answer}`).classList.add('bg-green-100', 'border-green-500');
                }
            }

            expBox.classList.remove('hidden');

            if (question.explanation.clue_ref) {
                document.querySelectorAll('.bg-yellow-300').forEach(el => el.classList.remove('bg-yellow-300', 'shadow-sm'));
                const clueEl = document.getElementById(question.explanation.clue_ref);
                if(clueEl) {
                    clueEl.classList.add('bg-yellow-300', 'shadow-sm');
                    clueEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function toggleTranslation() {
            const el = document.getElementById('passage-translation');
            el.classList.toggle('hidden');
        }

        function readPassageAloud() {
            const btn = document.getElementById('btn-read-passage');
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                btn.innerText = '🗣️ 朗讀文章';
                return;
            } 
            
            let textToRead = activeGroup.passage;
            if (activeGroup.type === 'cloze') {
                activeGroup.questions.forEach(q => {
                    let correctWord = q.options[q.answer].replace(/<[^>]+>/g, '');
                    textToRead = textToRead.replace(`[BLANK_${q.q_num}]`, correctWord);
                });
            }
            textToRead = textToRead.replace(/<[^>]+>/g, '');
            
            speechUtterance.text = textToRead;
            speechUtterance.lang = 'en-US';
            speechUtterance.rate = 0.9;
            window.speechSynthesis.speak(speechUtterance);
            isSpeaking = true;
            btn.innerText = '⏹️ 停止朗讀';
        }

        function toggleSpeakQuestion(btn, text) {
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                document.querySelectorAll('.btn-speak').forEach(b => b.innerText = '🗣️ 朗讀');
            } else {
                document.querySelectorAll('.btn-speak').forEach(b => b.innerText = '🗣️ 朗讀');
                speechUtterance.text = text;
                speechUtterance.lang = 'en-US';
                speechUtterance.rate = 0.9;
                window.speechSynthesis.speak(speechUtterance);
                isSpeaking = true;
                btn.innerText = '⏹️ 停止';
            }
        }

        function speakWord(word) {
            window.speechSynthesis.cancel(); 
            let u = new SpeechSynthesisUtterance(word);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
            isSpeaking = false; 
            document.querySelectorAll('.btn-speak').forEach(b => b.innerText = '🗣️ 朗讀');
            const pBtn = document.getElementById('btn-read-passage');
            if(pBtn) pBtn.innerText = '🗣️ 朗讀文章';
        }

        function bindVocabEvents() {
            const words = document.querySelectorAll('.lvl4-word');
            const tooltip = document.getElementById('dict-tooltip');

            words.forEach(el => {
                el.addEventListener('mouseenter', (e) => {
                    const word = e.target.dataset.word;
                    const pron = e.target.dataset.pron || '';
                    const def = e.target.dataset.def || '';
                    
                    speakWord(word); 
                    
                    tooltip.style.display = 'block';
                    tooltip.style.left = (e.pageX + 10) + 'px';
                    tooltip.style.top = (e.pageY + 20) + 'px';
                    
                    tooltip.innerHTML = `
                        <div class="font-bold text-blue-300 text-lg border-b border-gray-500 pb-1 mb-1">
                            ${word} <span class="text-xs font-normal text-gray-400 ml-1">${pron}</span>
                        </div>
                        <div class="text-gray-100 text-sm">${def}</div>
                    `;
                });
                el.addEventListener('mouseleave', () => tooltip.style.display = 'none');
            });
        }
    </script>
</body>
</html>
