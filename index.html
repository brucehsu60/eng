<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中英文歷屆題庫系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 id="exam-title" class="text-xl font-bold text-blue-600">📖 英文歷屆題庫系統 - 載入中...</h1>
            <div class="flex flex-wrap gap-2" id="question-navigator">
                <span class="text-sm text-gray-400">正在讀取題庫資料...</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex flex-col lg:flex-row gap-6 h-[75vh]" id="main-container">
            
            <!-- 左欄：文章區 -->
            <div id="passage-section" class="w-full lg:w-1/2 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col h-full hidden">
                <div class="bg-blue-50 px-4 py-2 border-b border-blue-100 font-bold text-blue-800 flex justify-between items-center">
                    <span id="part-name">大題名稱</span>
                    <button onclick="toggleTranslation()" class="text-xs bg-white border border-blue-200 px-2 py-1 rounded hover:bg-blue-100 transition">中英對照</button>
                </div>
                <div class="p-6 overflow-y-auto custom-scrollbar flex-1 text-lg leading-relaxed">
                    <div id="passage-content" class="text-gray-800"></div>
                    <div id="passage-translation" class="hidden mt-6 p-4 bg-gray-50 border-l-4 border-blue-400 text-base text-gray-700"></div>
                </div>
            </div>

            <!-- 右欄：題目與作答區 -->
            <div id="question-section" class="w-full lg:w-1/2 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col h-full mx-auto">
                <div class="bg-gray-100 px-4 py-2 border-b border-gray-200 font-bold text-gray-700">
                    <span id="q-title">Question</span>
                </div>
                
                <div class="p-6 overflow-y-auto custom-scrollbar flex-1">
                    <div id="q-text" class="text-lg font-medium text-gray-800 mb-6 leading-relaxed"></div>
                    
                    <div class="space-y-3 mb-6" id="options-container"></div>

                    <button id="submit-btn" onclick="checkAnswer()" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition disabled:opacity-50" disabled>
                        送出答案
                    </button>

                    <!-- 詳解區 -->
                    <div id="explanation-box" class="hidden mt-8 fade-in bg-gray-50 border border-gray-200 rounded-lg p-5">
                        <h4 class="font-bold text-lg mb-4" id="result-status"></h4>
                        <div class="mb-4">
                            <p class="font-bold text-gray-700 mb-1">【整句/題目翻譯】</p>
                            <p id="exp-translation" class="text-gray-600"></p>
                        </div>
                        <div class="mb-4">
                            <p class="font-bold text-gray-700 mb-1">【選項解析】</p>
                            <p id="exp-analysis" class="text-gray-600 whitespace-pre-line"></p>
                        </div>
                        <div id="vocab-section">
                            <p class="font-bold text-gray-700 mb-1">【必背單字】</p>
                            <ul id="exp-vocab" class="grid grid-cols-1 md:grid-cols-2 gap-2 text-gray-600 text-sm"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let examDatabase = {};
        let currentPartIndex = 0;
        let currentQuestionIndex = 0;
        let currentQuestionData = null;
        let userSelected = null;

        // 【修改點】網頁載入時，改為讀取 '083'
        window.onload = async () => {
            await loadExamData('083'); 
        };

        async function loadExamData(year) {
            try {
                // 這裡會去抓 data/083.json
                const response = await fetch(`data/${year}.json`);
                if (!response.ok) throw new Error(`找不到檔案 (HTTP ${response.status})`);
                
                examDatabase = await response.json();
                
                document.getElementById('exam-title').innerText = `📖 英文歷屆題庫系統 - ${examDatabase.exam_year}`;
                
                renderNavigator();
                loadQuestion(0, 0); 

            } catch (error) {
                console.error("題庫載入失敗:", error);
                document.getElementById('main-container').innerHTML = `
                    <div class="w-full p-8 bg-red-50 border border-red-200 rounded text-red-600">
                        <h2 class="text-xl font-bold mb-2">⚠️ 系統提示：無法讀取 JSON 資料</h2>
                        <p>原因：找不到 <b>data/${year}.json</b> 檔案，或是遇到跨網域 (CORS) 限制。</p>
                        <hr class="my-4 border-red-200">
                        <p><b>解決方法：</b><br>
                           1. 請確認 GitHub Repository 裡是否有 <code>data</code> 資料夾，且裡面有 <code>${year}.json</code><br>
                           2. 按下 Ctrl + F5 強制重新整理網頁。</p>
                    </div>`;
            }
        }

        function renderNavigator() {
            const nav = document.getElementById('question-navigator');
            nav.innerHTML = ''; 

            examDatabase.parts.forEach((part, pIndex) => {
                part.questions.forEach((q, qIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded-full text-sm font-bold transition';
                    btn.innerText = `第 ${q.q_num} 題`;
                    btn.onclick = () => loadQuestion(pIndex, qIndex);
                    nav.appendChild(btn);
                });
            });
        }

        function loadQuestion(pIndex, qIndex) {
            currentPartIndex = pIndex;
            currentQuestionIndex = qIndex;
            const partData = examDatabase.parts[pIndex];
            currentQuestionData = partData.questions[qIndex];
            userSelected = null;

            const passageSection = document.getElementById('passage-section');
            const questionSection = document.getElementById('question-section');
            
            if (partData.has_passage) {
                passageSection.classList.remove('hidden');
                questionSection.className = 'w-full lg:w-1/2 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col h-full mx-auto';
                document.getElementById('part-name').innerText = partData.part_name;

                let passageHtml = '';
                if (partData.passage_image) passageHtml += `<img src="${partData.passage_image}" alt="文章配圖" class="w-full h-auto mb-4 rounded shadow-sm">`;
                if (partData.passage) passageHtml += partData.passage;
                document.getElementById('passage-content').innerHTML = passageHtml;
                
                document.getElementById('passage-translation').innerHTML = partData.passage_translation || '暫無翻譯資料。';
                document.getElementById('passage-translation').classList.add('hidden');
            } else {
                passageSection.classList.add('hidden');
                questionSection.className = 'w-full lg:w-3/5 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col h-full mx-auto';
            }

            document.getElementById('q-title').innerText = `Question ${currentQuestionData.q_num}`;
            
            let qTextHtml = `<div class="mb-2">${currentQuestionData.q_num}. ${currentQuestionData.question}</div>`;
            if (currentQuestionData.question_image) qTextHtml += `<img src="${currentQuestionData.question_image}" alt="題目配圖" class="max-w-full h-auto mt-4 mb-4 rounded border">`;
            document.getElementById('q-text').innerHTML = qTextHtml;

            const optionsHtml = Object.entries(currentQuestionData.options).map(([key, value]) => `
                <label class="block p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-blue-50 transition" id="label-${key}">
                    <input type="radio" name="q_option" value="${key}" class="mr-2" onclick="selectOption('${key}')"> 
                    (${key}) ${value}
                </label>
            `).join('');
            document.getElementById('options-container').innerHTML = optionsHtml;

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.style.display = 'block';
            document.getElementById('explanation-box').classList.add('hidden');
        }

        function selectOption(val) {
            userSelected = val;
            document.getElementById('submit-btn').disabled = false;
            
            Object.keys(currentQuestionData.options).forEach(key => {
                document.getElementById(`label-${key}`).classList.remove('bg-blue-50', 'border-blue-500');
            });
            document.getElementById(`label-${val}`).classList.add('bg-blue-50', 'border-blue-500');
        }

        function checkAnswer() {
            if (!userSelected) return;

            document.querySelectorAll('input[type="radio"]').forEach(input => input.disabled = true);
            document.getElementById('submit-btn').style.display = 'none';

            const correctAns = currentQuestionData.correct_answer;
            const statusTitle = document.getElementById('result-status');
            
            if (userSelected === correctAns) {
                statusTitle.innerHTML = `✅ 答對了！正確答案：(${correctAns})`;
                statusTitle.className = 'font-bold text-green-600 text-lg mb-4';
                document.getElementById(`label-${userSelected}`).classList.add('bg-green-100', 'border-green-500');
            } else {
                statusTitle.innerHTML = `❌ 答錯了！正確答案為：(${correctAns})`;
                statusTitle.className = 'font-bold text-red-600 text-lg mb-4';
                document.getElementById(`label-${userSelected}`).classList.add('bg-red-50', 'border-red-400');
                document.getElementById(`label-${correctAns}`).classList.add('bg-green-100', 'border-green-500');
            }

            const exp = currentQuestionData.explanation;
            document.getElementById('exp-translation').innerHTML = exp.translation || '';
            document.getElementById('exp-analysis').innerHTML = exp.analysis || '';
            
            const vocabSection = document.getElementById('vocab-section');
            if (exp.vocab && exp.vocab.length > 0) {
                vocabSection.style.display = 'block';
                const vocabHtml = exp.vocab.map(v => `<li><span class="text-blue-600 font-semibold">${v.word}</span> (${v.pos}) ${v.meaning}</li>`).join('');
                document.getElementById('exp-vocab').innerHTML = vocabHtml;
            } else {
                vocabSection.style.display = 'none';
            }

            document.getElementById('explanation-box').classList.remove('hidden');
        }

        function toggleTranslation() {
            const trans = document.getElementById('passage-translation');
            trans.classList.toggle('hidden');
            trans.classList.add('fade-in');
        }
    </script>
</body>
</html>
